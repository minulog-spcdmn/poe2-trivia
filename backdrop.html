<!doctype html>
<!-- The backdrop tool: Delve's real backdrop full screen, with a panel to tweak,
     generate and pick each zone's look and the endgame's (src/backdropTool).
     data-backdrop-tool gives its storage keys their own start (src/lib/storage.ts). -->
<html lang="en" data-backdrop-tool>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="robots" content="noindex" />
    <title>PoE2.Quest • Backdrops</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="tool"></div>
    <script type="module" src="/src/backdropTool/main.ts"></script>
  </body>
</html>
