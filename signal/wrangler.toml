# The game's own matchmaking server (worker.js); README, "Matchmaking server".
# Cloudflare Workers Builds deploys it from main whenever a merge changes
# signal/, with this file as it is on main.
name = "poe2-signal"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# No request logs kept: they'd store each player's IP address (datenschutz.html).
[observability]
enabled = false

# The one Object every peer meets in (SQLite-backed, as the free plan has them).
[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "Signal"

# Players' progress kept with their passkeys (worker.js, Keep): an Object per
# bucket, SQLite-backed too.
[[durable_objects.bindings]]
name = "KEEP"
class_name = "Keep"

# Every player's answers, added up per item, form and the rules each was
# asked under (worker.js, Tally): one Object, SQLite-backed, keeping the
# sums (200,000 at most) and, for a day, each batch's random id with when it
# came, writing 850 rows a UTC hour at most (about 20,000 a day) and its full
# reads going through 1,000,000 rows a UTC day at most.
[[durable_objects.bindings]]
name = "TALLY"
class_name = "Tally"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Signal"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Keep"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Tally"]

# Connections (and new ids) a single address (an IPv6 one's /56) may ask for
# a minute: a page makes a few as it hosts, joins or lists the open rooms, and
# again as it reconnects; this slows a script spending the free allowance,
# with room for a school's or a carrier's shared address.
[[ratelimits]]
name = "PER_ADDRESS"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# Of those, writes to the progress kept with passkeys (worker.js, Keep): a page
# sends at most every few minutes, so thirty a minute is a school's or a
# carrier's many players, and a script making up buckets fills little.
[[ratelimits]]
name = "KEEP_WRITES"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# Of those, the answers tallied (worker.js, Tally): a page sends as a game or
# run ends, as it's hidden (on a phone, each time the player switches away)
# and every forty answers, a batch turned down going again with the next.
# Schools and carriers put many players behind one address, so thirty a
# minute; asked before the address's own limit, so a batch turned away here
# leaves its matchmaking allowance alone. The tally's share of the free
# plan's writes is held in the Worker itself (TALLY_HOURLY).
[[ratelimits]]
name = "TALLY_WRITES"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 30
  period = 60
