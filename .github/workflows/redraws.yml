name: Redraws
run-name: "Redraws: ${{ github.event.pull_request.title || github.ref_name }}"

# The redraw check (docs/qa.md, "Redraws"), on every pull request into main:
# each QA scene at rest and the card bench's moments, traced in Chromium,
# fail on a layer Chrome draws again on nearly every frame at rest, or a moment past
# its baseline (src/qa/redrawBaselines.json). Every stutter of October 2026 was one
# of those. It runs here, not on anyone's machine: every scene in a browser
# at full motion. There's no GPU here, so it all draws in
# software, at 2 or 3 frames a second (some scenes, a frame every few
# seconds): the scenes are split over eight jobs and the moments over three.
# What's counted is counted in frames, the animations on a clock slowed to
# them, so it holds at that pace (docs/qa.md, "Redraws").
#
# Run it by hand (Run workflow) on any branch, and the job's summary lists
# what it found and the moments as measured, to commit as the baseline when
# a change means them to cost more or less.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redraws-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redraws:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Moments, 1 of 3', args: '--moments --shard 1/3' }
          - { name: 'Moments, 2 of 3', args: '--moments --shard 2/3' }
          - { name: 'Moments, 3 of 3', args: '--moments --shard 3/3' }
          - { name: 'At rest, 1 of 8', args: '--shard 1/8' }
          - { name: 'At rest, 2 of 8', args: '--shard 2/8' }
          - { name: 'At rest, 3 of 8', args: '--shard 3/8' }
          - { name: 'At rest, 4 of 8', args: '--shard 4/8' }
          - { name: 'At rest, 5 of 8', args: '--shard 5/8' }
          - { name: 'At rest, 6 of 8', args: '--shard 6/8' }
          - { name: 'At rest, 7 of 8', args: '--shard 7/8' }
          - { name: 'At rest, 8 of 8', args: '--shard 8/8' }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium as playwright-core's version has it, kept between runs.
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - run: npx playwright-core install --with-deps chromium
      - run: npm run sweep -- --redraws ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: redraws-${{ strategy.job-index }}
          path: screens/redraws-*/report.json
          retention-days: 14
