name: Tally ready
run-name: "Tally ready: ${{ github.event_name == 'schedule' && 'daily check' || 'run by hand' }}"

# Once a day: does the item tally (signal/worker.js Tally) hold enough
# answers to tell which items players miss far more than the rest, the ones
# a balance change would keep out of Delve's shallow depths? A script reads
# the tally and sorts the items (scripts/tally-ready.mjs; its summary goes on
# the run's page every day). While plainly too few items are decided (the
# script's FLOOR) nothing more happens, so those days cost nothing. Past the
# floor Claude weighs the summary and answers READY or NOT_YET; on READY a
# later job, without Claude, opens an issue assigned to the owner, which
# GitHub sends to them, and from then on the runs stop by themselves until
# the tally's version (src/lib/itemTallyRank.ts TALLY_VERSION) changes.
# A day the tally can't be read (not on the server yet, busy, its day's
# reads spent) passes with a note on the run's page. A run fails, so GitHub
# mails the owner, when the server turns the check away, answers in a shape
# the script doesn't know, or Claude's answer has the wrong shape.
#
# Claude runs as `claude -p` on the Claude API, paid from the owner's Console
# organization by workload identity federation, with no key stored
# (scripts/claude-in-ci.sh says how and why). It needs the repository
# secrets ANTHROPIC_FEDERATION_RULE_ID and ANTHROPIC_ORGANIZATION_ID (and
# ANTHROPIC_SERVICE_ACCOUNT_ID and ANTHROPIC_WORKSPACE_ID if the rule names
# them). Claude gets no tools and no GitHub access: the summary is in its
# prompt, and it holds only items.json's names and numbers (anyone can send
# the tally ids, so the script leaves out every id items.json doesn't have).
#
# Run by hand with "Try Claude" to try Claude's step before the floor is
# met: its answer goes on the run's page and opens no issue.
#
# A second job, `solo`, without Claude, settles whether answers from solo
# Delve reach the tally (they hadn't by 19 Nov 2026, the day after it went
# live): scripts/tally-solo.mjs sets the tally's solo Delve answers against
# the solo runs GoatCounter counted since then (secret GOATCOUNTER_KEY). Any
# answer opens an issue assigned to the owner saying they arrive; three runs
# or more and none opens one saying they don't, and the run fails so GitHub
# mails the owner. Once either issue is open the job stops by itself; remove
# it from this file then.

on:
  # 06:41 UTC: well after midnight UTC, when the tally's day of reads starts
  # anew. Off the hour, when GitHub's scheduled runs bunch up.
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      try_claude:
        description: Ask Claude even below the floor (its answer goes on the run's page and opens no issue)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Count and ask
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      ready: ${{ steps.answer.outputs.ready }}
      title: ${{ steps.needed.outputs.title }}
      report: ${{ steps.answer.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Still needed?
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^export const TALLY_VERSION = \([0-9][0-9]*\);.*/\1/p' src/lib/itemTallyRank.ts)
          if [ -z "$v" ]; then
            echo "::error::No TALLY_VERSION in src/lib/itemTallyRank.ts"
            exit 1
          fi
          title="Item tally v$v: enough answers for balance changes"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          # Only an issue this workflow opened stops it, not one anyone else
          # titles the same way.
          opened=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --author 'app/github-actions' --search "in:title \"$title\"" \
            --json title | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$opened" != "0" ]; then
            echo "Tally v$v was already reported ready; nothing left to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # No npm ci: the script and the page's files it runs import no packages.
      - uses: actions/setup-node@v4
        if: steps.needed.outputs.run == 'true'
        with:
          node-version: 22

      - name: Read the tally
        id: tally
        if: steps.needed.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/tally-ready.mjs --out "$RUNNER_TEMP/summary.md"

      - name: Ask Claude
        id: claude
        if: >-
          steps.needed.outputs.run == 'true' &&
          (steps.tally.outputs.ask == 'true' || (github.event_name == 'workflow_dispatch' && inputs.try_claude))
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          if [ ! -s "$RUNNER_TEMP/summary.md" ]; then
            echo "No summary to ask about: the tally couldn't be read today."
            echo "asked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.327
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          You decide whether the item tally of PoE2.Quest, a quiz on Path of Exile 2's unique items, holds enough answers to act on. The change it is for: keep the most obscure items, the ones players miss far more often than the rest, out of the shallow depths of Delve (the game's endless mode, harder the deeper it goes). The owner makes that change; you only say whether the data is ready for it.

          How the numbers below are made:
          - Every answer from every mode is counted, right or wrong, under the rules it was asked under: the mode, its difficulty, and in Delve the depth, in bands of ten.
          - Each item's misses are set against the misses expected of it: its answers under each set of rules times every item's miss rate under those rules. Its score is misses over expected: 1 is missed as often as the rest, 2 twice as often. First meetings and repeats count together.
          - Each score has a 90% interval. An item is clearly above the cut when its interval lies wholly above it, clearly below when wholly below, and undecided otherwise, or when it has no answers yet.
          - The "first meetings only" line counts the same way but only answers given when the player met the item in this game for the first time. Players also know items from Path of Exile 2 itself, so the two views can differ.

          The data is ready when the list of items clearly above the cut is unlikely to change much with more answers. Weigh:
          - How many items are still undecided, and how many of those score at or above the cut without being clearly above it.
          - Whether undecided items gather in a few groups, small groups above all: a group whose items are mostly undecided can't be judged yet.
          - Whether enough of the answers come from Delve's shallow depths (1-10, 11-20), where the change would act.
          - The first-meetings view as a second opinion, not a requirement.
          - The intervals treat every answer as independent, but the same players answer the same items again, so the true uncertainty is wider: an item clearly above on few answers is weaker evidence than it looks.

          The summary below is all you have. Do not guess at numbers it does not give.

          Your last message is read by a script. Its first line must be exactly one of these words, alone:
          - NOT_YET: not enough yet. On the next line, say in one sentence what is short.
          - READY: enough to act on. After that line, write a short report for the owner in plain words, at most 250 words: why the data is enough, which items stand out most (a few by name with their scores), and what calls for care (groups still undecided, a thin first-meetings view). Propose no change to the game: the owner decides that.

          The summary:

          PROMPT
          cat "$RUNNER_TEMP/summary.md" >> "$RUNNER_TEMP/prompt.md"
          bash scripts/claude-in-ci.sh "$RUNNER_TEMP/prompt.md" "$RUNNER_TEMP/answer.md" \
            --model claude-opus-5-5 \
            --max-turns 3 \
            --max-budget-usd 1 \
            --permission-mode default \
            --strict-mcp-config \
            --tools ''
          echo "asked=true" >> "$GITHUB_OUTPUT"

      - name: Read the answer
        id: answer
        if: steps.claude.outputs.asked == 'true'
        env:
          # Below the floor (a run by hand trying Claude), a READY opens nothing.
          COUNTS: ${{ steps.tally.outputs.ask }}
        run: |
          answer="$RUNNER_TEMP/answer.md"
          # From its first line with words on it.
          sed -i '/[^[:space:]]/,$!d' "$answer"
          first=$(head -n 1 "$answer" | tr -d '[:space:]')
          case "$first" in
            NOT_YET)
              echo "Not enough yet: $(sed -n 2p "$answer" | head -c 300)"
              { echo; echo "### Claude: not enough yet"; echo; tail -n +2 "$answer" | head -c 1000; echo; } >> "$GITHUB_STEP_SUMMARY"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              ;;
            READY)
              { echo; echo "### Claude: ready"; echo; tail -n +2 "$answer" | head -c 4000; echo; } >> "$GITHUB_STEP_SUMMARY"
              if [ "$COUNTS" != "true" ]; then
                echo "Claude said ready, but the counts are below the floor: a try, no issue."
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "ready=true" >> "$GITHUB_OUTPUT"
              # A delimiter nothing in the report can hold.
              end="TALLY_REPORT_$(openssl rand -hex 16)"
              {
                echo "report<<$end"
                tail -n +2 "$answer" | head -c 4000
                echo
                echo
                echo "---"
                echo
                head -c 40000 "$RUNNER_TEMP/summary.md"
                echo
                echo
                echo "From the daily check, .github/workflows/tally-ready.yml. The full list: \`npm run item-tally\`, or the stats page's Items view."
                echo "$end"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Claude's answer has the wrong shape: $(head -c 300 "$answer" | tr '\n' ' ')"
              exit 1
              ;;
          esac

  tell:
    name: Tell the owner
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.check.outputs.title }}
          REPORT: ${{ needs.check.outputs.report }}
        run: |
          printf '%s\n' "$REPORT" > report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body-file report.md

  solo:
    name: Solo Delve answers arrive?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Still needed?
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only an issue this workflow opened stops it, not one anyone else
          # titles the same way.
          opened=0
          for title in 'Item tally: solo Delve answers arrive' 'Item tally: solo Delve runs send no answers'; do
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --author 'app/github-actions' --search "in:title \"$title\"" \
              --json title | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
            opened=$((opened + n))
          done
          if [ "$opened" != "0" ]; then
            echo "Solo Delve was already reported on; nothing left to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # No npm ci: the script imports no packages.
      - uses: actions/setup-node@v4
        if: steps.needed.outputs.run == 'true'
        with:
          node-version: 22

      - name: Count solo answers and runs
        id: solo
        if: steps.needed.outputs.run == 'true'
        env:
          GOATCOUNTER_KEY: ${{ secrets.GOATCOUNTER_KEY }}
        run: node --experimental-strip-types --no-warnings scripts/tally-solo.mjs

      - name: Open the issue
        id: issue
        if: steps.solo.outputs.verdict == 'works' || steps.solo.outputs.verdict == 'lost'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.solo.outputs.title }}
          BODY_FILE: ${{ steps.solo.outputs.body }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body-file "$BODY_FILE"

      # Fails the run, so GitHub mails the owner, for solo runs that send nothing.
      - name: Fail on lost answers
        if: steps.solo.outputs.verdict == 'lost'
        run: |
          echo "::error::Solo Delve runs send no answers to the item tally. See the issue."
          exit 1
