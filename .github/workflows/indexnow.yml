name: IndexNow
run-name: "IndexNow: ${{ github.event_name == 'workflow_dispatch' && 'run by hand' || 'after a deploy' }}"

# After a deploy that changed what search engines read (index.html or the
# sitemap), tell the engines that take IndexNow (Bing, and so DuckDuckGo,
# Yahoo and Ecosia; Yandex, Seznam, Naver, Yep) that https://poe2.quest/ is
# new, so they read it again within days instead of whenever their crawler
# comes by. They pass every ping on to each other. Google doesn't take part.
#
# No account: the key is public by design, and public/49f0827c4e617019e57c852e758cf737.txt (the key
# alone) proves the site sends it. A new key is only a new file of that
# name and KEY below. Pinging an unchanged page too often gets a 429, so
# other deploys send nothing. A failed ping fails the run, and GitHub mails
# the owner.

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEY: 49f0827c4e617019e57c852e758cf737

jobs:
  ping:
    name: Tell the search engines
    # Main's own deploys, not a beta put up by hand (a workflow_dispatch run).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Did the page change?
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet HEAD^1 HEAD -- index.html public/sitemap.xml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing a search engine reads changed; no ping."
          fi
      - name: Ping IndexNow
        if: steps.changed.outputs.changed == 'true'
        run: |
          test -f "public/$KEY.txt" || { echo "public/$KEY.txt is missing"; exit 1; }
          # 200: taken. 202: taken, the key still to be checked. 4xx: the key or the URL refused.
          curl --fail-with-body -sS -w '\nHTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"poe2.quest\",\"key\":\"$KEY\",\"keyLocation\":\"https://poe2.quest/$KEY.txt\",\"urlList\":[\"https://poe2.quest/\"]}"
