name: IndexNow
run-name: "IndexNow: ${{ github.event_name == 'workflow_dispatch' && 'run by hand' || 'after a deploy' }}"

# After a deploy that changed what search engines read (index.html or the
# sitemap), tell the engines that take IndexNow (Bing, and so DuckDuckGo,
# Yahoo and Ecosia; Yandex, Seznam, Naver, Yep, Amazon) that
# https://poe2.quest/ is new, so they read it again within days instead of whenever their crawler
# comes by. They pass every ping on to each other. Google doesn't take part.
#
# "Changed" is since main's last deploy that went through, not since the
# commit before: GitHub keeps only the newest waiting deploy (deploy.yml's
# concurrency), so one deploy can put up several merges, and a failed one
# leaves its change to the next. A run by hand pings whatever changed.
#
# No account: the key is public by design, and the file of its name in
# public/ (the key alone) proves the site sends it. A new key is only a new
# file there and KEY below. Pinging an unchanged page too often gets a 429,
# so other deploys send nothing. Only a ping IndexNow refuses (the key or the
# URL, which needs fixing) fails the run, and GitHub mails the owner; its own
# trouble (429, a 5xx, no answer) is retried, then left as a warning.

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  KEY: 49f0827c4e617019e57c852e758cf737

jobs:
  ping:
    name: Tell the search engines
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did the page change since the last deploy?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Main's last deploy that went through before this one (a beta's run deploys main too).
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at < \"$CREATED\")][0].head_sha // empty")
          if [ -z "$prev" ]; then
            echo "No earlier deploy found; pinging."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The compare lists at most 300 files: a range that long pings to be safe.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$HEAD_SHA" --jq 'if (.files | length) >= 300 then "index.html" else .files[].filename end')
          if grep -qxE 'index\.html|public/sitemap\.xml' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing a search engine reads changed since ${prev:0:7}; no ping."
          fi
      - name: Ping IndexNow
        if: steps.changed.outputs.changed == 'true'
        run: |
          # The engines fetch the key from the site, so check the site has it, not the repo.
          # Pages can take a moment past the deploy to serve a new file.
          for try in $(seq 12); do
            served=$(curl -sf "https://poe2.quest/$KEY.txt?try=$try") && [ "$served" = "$KEY" ] && break
            [ "$try" = 12 ] && { echo "::error::https://poe2.quest/$KEY.txt doesn't serve the key"; exit 1; }
            sleep 10
          done
          # curl retries a 429, a 5xx and a timeout by itself.
          code=$(curl -sS -o answer.txt -w '%{http_code}' --retry 3 --retry-delay 20 --max-time 30 \
            -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"poe2.quest\",\"key\":\"$KEY\",\"keyLocation\":\"https://poe2.quest/$KEY.txt\",\"urlList\":[\"https://poe2.quest/\"]}") || code=000
          cat answer.txt 2>/dev/null; echo "HTTP $code"
          case "$code" in
            # Taken; 202 with the key still to be checked.
            200|202) ;;
            # Refused: a bad request, the key not matching, or the URL not the key's host.
            400|403|422) echo "::error::IndexNow refused the ping (HTTP $code)"; exit 1 ;;
            *) echo "::warning::IndexNow didn't take the ping (HTTP $code); run this workflow by hand to try again" ;;
          esac
