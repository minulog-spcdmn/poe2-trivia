name: Daily health
run-name: "Daily health: ${{ (github.event.schedule == '23 12 * * *' || inputs.last_24h) && 'the last 24 hours' || github.event_name == 'schedule' && 'yesterday' || 'run by hand' }}"

# Analytics' own checks (stats.html: joining, the game's script errors, parts
# that didn't load, stutter), twice a day (scripts/daily-health.mjs): after
# midnight on yesterday against the 7 days before, and at midday on the 24
# hours to then against the same hours of the 7 days before (--last-24h), so
# a fault in the morning is seen half a day sooner. A check that fires fails
# the run, and GitHub emails a failed scheduled run to whoever last changed
# its schedule: a fault the counts show is mailed within about half a day,
# its reasons on the run's page as errors. Either failing wakes the health
# responder (health-responder.yml), which leaves an alert it's already
# handling at a comment. The only other failures are a key GoatCounter
# refuses and the check itself broken (a bug, or answers of a new shape): a day
# GoatCounter can't be read (no answer, a 5xx, its hour's limit spent)
# passes with a warning there that the check couldn't run.
#
# It needs the read-only GoatCounter key as the repository secret
# GOATCOUNTER_KEY; without it the run passes, saying the check is off. Its
# few requests a run count against GoatCounter's 500 an hour beside the
# owner's stats page.
#
# Before turning it on: GOATCOUNTER_KEY=<key> node --experimental-strip-types scripts/daily-health.mjs
# --backtest 60 says how often it would have mailed (with --last-24h, the
# midday check).

on:
  # 00:23 UTC: after midnight in Central Europe, summer and winter (the
  # script checks the account's own yesterday, whole wherever its zone is).
  # 12:23 UTC: the midday check, its 24 hours ending at the start of the
  # hour the run begins in, however late GitHub starts it. Off the hour,
  # when GitHub's scheduled runs bunch up. The midday cron is named again
  # below and in run-name: change all three together.
  schedule:
    - cron: '23 0 * * *'
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      last_24h:
        description: The midday check (the last 24 hours) instead of yesterday's
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  health:
    name: Daily health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No npm ci: the script and the page's files it runs import no packages.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        env:
          GOATCOUNTER_KEY: ${{ secrets.GOATCOUNTER_KEY }}
          LAST_24H: ${{ github.event.schedule == '23 12 * * *' || inputs.last_24h }}
        run: |
          if [ "$LAST_24H" = true ]; then
            node --experimental-strip-types --no-warnings scripts/daily-health.mjs --last-24h
          else
            node --experimental-strip-types --no-warnings scripts/daily-health.mjs
          fi
