<!doctype html>
<!-- The card bench: any category card, plain or with a find, up to three of
     them dealt on the real game screen, which runs in a frame
     (cards.html?stage) so it can be set to a phone's width.
     data-lab data-cards give its storage keys their own start (src/lib/storage.ts). -->
<html lang="en" data-lab data-cards>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="robots" content="noindex" />
    <title>PoE2.Quest • Card bench</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/cardBench/main.ts"></script>
  </body>
</html>
